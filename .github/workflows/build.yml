name: Build OpenWrt firmware
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Build inside Ubuntu 20.04 container
        run: |
          docker run --rm -v "$PWD":/build -w /build ubuntu:20.04 bash -c "
            export DEBIAN_FRONTEND=noninteractive &&
            apt-get update &&
            apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
              zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip \
              python3 python3-distutils python2 &&
            ln -sf /usr/bin/python2 /usr/bin/python &&
            ./scripts/feeds update -a &&
            ./scripts/feeds install -a &&
            make defconfig FORCE=1 &&
            make -j\$(nproc) V=s FORCE=1
          "

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: bin/targets/ramips/mt76x8/*
