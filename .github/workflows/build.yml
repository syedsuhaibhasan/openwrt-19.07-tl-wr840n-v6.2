name: Build OpenWrt packet-capture firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Build inside Ubuntu 20.04 container
        run: |
          docker run --rm \
            -v "$PWD":/build \
            -w /build \
            ubuntu:20.04 \
            bash -c '
              set -e

              export DEBIAN_FRONTEND=noninteractive
              export FORCE_UNSAFE_CONFIGURE=1

              echo "===== Installing build dependencies ====="

              apt-get update

              apt-get install -y \
                binutils \
                bzip2 \
                diffutils \
                findutils \
                flex \
                gawk \
                gcc \
                g++ \
                grep \
                coreutils \
                build-essential \
                zlib1g-dev \
                make \
                perl \
                python3 \
                python3-distutils \
                python2 \
                rsync \
                subversion \
                unzip \
                libncurses5-dev \
                libncursesw5-dev \
                libssl-dev \
                gettext \
                xsltproc \
                wget \
                git \
                file \
                bc \
                libelf-dev \
                texinfo

              ln -sf /usr/bin/python2 /usr/bin/python

              git config --global --add safe.directory /build

              echo "===== Updating feeds ====="

              ./scripts/feeds update -a
              ./scripts/feeds install -a

              echo "===== Cleaning conflicting build options ====="

              # These options build large package collections/SDKs
              # and are not needed in the router firmware.
              sed -i \
                -e "/^CONFIG_ALL_KMODS=/d" \
                -e "/^CONFIG_ALL_NONSHARED=/d" \
                -e "/^CONFIG_DEVEL=/d" \
                -e "/^CONFIG_BUILDBOT=/d" \
                -e "/^CONFIG_IB=/d" \
                -e "/^CONFIG_SDK=/d" \
                -e "/^CONFIG_AUTOREMOVE=/d" \
                .config

              echo "===== Removing LuCI ====="

              # Do not include LuCI on this 4 MB device.
              sed -i \
                -e "/^CONFIG_PACKAGE_luci=/d" \
                -e "/^CONFIG_PACKAGE_luci-/d" \
                -e "/^CONFIG_PACKAGE_luci-base=/d" \
                -e "/^CONFIG_PACKAGE_luci-compat=/d" \
                -e "/^CONFIG_PACKAGE_luci-lib-/d" \
                -e "/^CONFIG_PACKAGE_luci-mod-/d" \
                -e "/^CONFIG_PACKAGE_luci-proto-/d" \
                -e "/^CONFIG_PACKAGE_luci-theme-/d" \
                -e "/^CONFIG_PACKAGE_rpcd-mod-luci=/d" \
                -e "/^CONFIG_PACKAGE_cgi-io=/d" \
                -e "/^CONFIG_PACKAGE_liblucihttp=/d" \
                -e "/^CONFIG_PACKAGE_liblucihttp-lua=/d" \
                .config

              echo "===== Adding packet-capture packages ====="

              cat >> .config << "EOF"

              CONFIG_PACKAGE_tcpdump=y
              CONFIG_PACKAGE_libpcap=y

              CONFIG_PACKAGE_dropbear=y
              CONFIG_PACKAGE_iw=y
              CONFIG_PACKAGE_uhttpd=y
              EOF

              echo "===== Resolving configuration ====="

              make defconfig

              echo "===== Verifying selected packages ====="

              grep -E \
                "CONFIG_PACKAGE_(tcpdump|libpcap|dropbear|iw|uhttpd)=" \
                .config || true

              echo "===== Building firmware ====="

              make -j$(nproc) V=s

              echo "===== BUILD COMPLETE ====="

              echo "===== Firmware images ====="

              find /build/bin/targets/ramips/mt76x8 \
                -type f \
                \( -name "*.bin" -o -name "*.manifest" -o -name "*.buildinfo" \) \
                -print \
                -exec ls -lh {} \;

              echo "===== Checking generated manifest ====="

              find /build/bin/targets/ramips/mt76x8 \
                -type f \
                -name "*.manifest" \
                -exec sh -c "echo ===== {} =====; cat {}" \;
            '

      - name: Verify firmware output
        run: |
          echo "===== Firmware output on GitHub runner ====="

          if [ ! -d "bin/targets/ramips/mt76x8" ]; then
            echo "ERROR: OpenWrt output directory does not exist."
            echo "Searching for generated firmware..."
            find bin -type f -name "*.bin" -print || true
            exit 1
          fi

          find bin/targets/ramips/mt76x8 \
            -maxdepth 1 \
            -type f \
            \( -name "*.bin" -o -name "*.manifest" -o -name "*.buildinfo" \) \
            -print \
            -exec ls -lh {} \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packet-capture
          path: |
            bin/targets/ramips/mt76x8/*.bin
            bin/targets/ramips/mt76x8/*.manifest
            bin/targets/ramips/mt76x8/*.buildinfo
          if-no-files-found: error
